<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "price-monitor" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/monitors" aria-label="price-monitor">
        <span class="brand-mark">₽</span>
        <span>price-monitor</span>
      </a>
      {% if user %}
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/monitors" class="{{ 'is-active' if current_path.startswith('/monitors') else '' }}">Мониторинги</a>
          <a href="/profile" class="{{ 'is-active' if current_path.startswith('/profile') else '' }}">Профиль</a>
        </nav>
        <form method="post" action="/logout" class="logout-form" data-loading>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="icon-button" type="submit" title="Выйти" aria-label="Выйти">↗</button>
        </form>
      {% endif %}
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
