{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">Новый пароль</p>
    <h1>Сброс пароля</h1>
    <p>Задайте новый пароль для аккаунта. Ссылка одноразовая и действует ограниченное время.</p>
  </div>

  <form method="post" action="/reset-password" class="form-panel" data-loading novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ form.token or '' }}">
    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <label class="field">
      <span>Новый пароль</span>
      <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <small>Минимум 8 символов.</small>
    </label>

    <button class="button button-primary" type="submit">
      <span class="button-label">Сохранить пароль</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <p class="form-note"><a href="/login">Вернуться ко входу</a></p>
  </form>
</section>
{% endblock %}
