{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">Мониторинг цен</p>
    <h1>Вход</h1>
    <p>Следите за товарами по ссылке, задавайте целевую цену и получайте уведомления, когда цена достигает порога.</p>
  </div>

  <form method="post" action="/login" class="form-panel" data-loading novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <label class="field">
      <span>Email</span>
      <input name="email" type="email" autocomplete="email" required maxlength="320" value="{{ form.email or '' }}">
      <small>Используется как логин.</small>
    </label>

    <label class="field">
      <span>Пароль</span>
      <input name="password" type="password" autocomplete="current-password" required maxlength="128">
    </label>

    <button class="button button-primary" type="submit">
      <span class="button-label">Войти</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <p class="form-note">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
  </form>
</section>
{% endblock %}
