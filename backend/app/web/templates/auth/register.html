{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">Быстрый старт</p>
    <h1>Регистрация</h1>
    <p>Создайте аккаунт, добавьте ссылку на товар и задайте цену, при которой нужно отправить уведомление.</p>
  </div>

  <form method="post" action="/register" class="form-panel" data-loading novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <label class="field">
      <span>Email</span>
      <input name="email" type="email" autocomplete="email" required maxlength="320" value="{{ form.email or '' }}">
      <small>Например: user@example.com</small>
    </label>

    <label class="field">
      <span>Пароль</span>
      <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <small>Минимум 8 символов.</small>
    </label>

    <button class="button button-primary" type="submit">
      <span class="button-label">Создать аккаунт</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <p class="form-note">Уже есть аккаунт? <a href="/login">Войти</a></p>
  </form>
</section>
{% endblock %}
