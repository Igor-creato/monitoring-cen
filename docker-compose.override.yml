services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  worker:
    volumes:
      - ./backend:/app/backend

  mariadb:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"
